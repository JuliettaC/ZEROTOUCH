plugins { id 'com.android.application' }

android {
    namespace 'cl.zerotouch.mobile'
    compileSdk 36
    defaultConfig {
        applicationId 'cl.zerotouch.mobile'
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName '0.1.0-poc'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    androidResources { noCompress += 'task' }
    signingConfigs { debug { storeFile file("${layout.buildDirectory.get()}/zerotouch-debug.keystore") } }
}

dependencies { implementation 'com.google.mediapipe:tasks-vision:0.10.21' }

tasks.register('verifyModel') {
    doLast {
        def model = file('src/main/assets/gesture_recognizer.task')
        if (!model.isFile()) {
            throw new GradleException('Falta el modelo real gesture_recognizer.task. Leer android/README.md; no se genera una APK simulada.')
        }
        def digest = java.security.MessageDigest.getInstance('SHA-256').digest(model.bytes).encodeHex().toString()
        if (digest != '97952348cf6a6a4915c2ea1496b4b37ebabc50cbbf80571435643c455f2b0482')
            throw new GradleException('El modelo no coincide con el SHA-256 fijado. No se empaqueta.')
    }
}
tasks.named('preBuild').configure { dependsOn 'verifyModel' }

// La firma de depuración vive en el directorio de build (nunca en Git). AGP solo crea por sí mismo
// ~/.android/debug.keystore, así que esta clave se genera aquí con keytool del JDK si falta.
tasks.register('createDebugKeystore') {
    def keystore = layout.buildDirectory.file('zerotouch-debug.keystore')
    outputs.file(keystore)
    doLast {
        def target = keystore.get().asFile
        if (target.isFile()) return
        target.parentFile.mkdirs()
        def keytool = new File(System.getProperty('java.home'), 'bin/keytool' + (System.getProperty('os.name').toLowerCase().contains('win') ? '.exe' : ''))
        def process = [keytool.absolutePath, '-genkeypair', '-noprompt', '-keystore', target.absolutePath,
            '-storepass', 'android', '-keypass', 'android', '-alias', 'androiddebugkey', '-keyalg', 'RSA',
            '-keysize', '2048', '-validity', '3650', '-dname', 'CN=ZeroTouch Debug,O=ZeroTouch,C=CL'].execute()
        process.waitForProcessOutput(System.out, System.err)
        if (process.exitValue() != 0) throw new GradleException('No se pudo crear la clave de depuración con keytool.')
    }
}
tasks.matching { it.name == 'validateSigningDebug' }.configureEach { dependsOn 'createDebugKeystore' }
