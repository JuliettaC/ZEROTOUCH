plugins { id 'com.android.application' }

android {
    namespace 'cl.zerotouch.mobile'
    compileSdk 36
    defaultConfig {
        applicationId 'cl.zerotouch.mobile'
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName '0.1.0-poc'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    androidResources { noCompress += 'task' }
    signingConfigs { debug { storeFile file("${layout.buildDirectory.get()}/zerotouch-debug.keystore") } }
}

dependencies { implementation 'com.google.mediapipe:tasks-vision:0.10.21' }

tasks.register('verifyModel') {
    doLast {
        def model = file('src/main/assets/gesture_recognizer.task')
        if (!model.isFile()) {
            throw new GradleException('Falta el modelo real gesture_recognizer.task. Leer android/README.md; no se genera una APK simulada.')
        }
        def digest = java.security.MessageDigest.getInstance('SHA-256').digest(model.bytes).encodeHex().toString()
        if (digest != '97952348cf6a6a4915c2ea1496b4b37ebabc50cbbf80571435643c455f2b0482')
            throw new GradleException('El modelo no coincide con el SHA-256 fijado. No se empaqueta.')
    }
}
tasks.named('preBuild').configure { dependsOn 'verifyModel' }
