          "mensaje": {
            "type": "string"
          }
        },
        "required": [
          "estado_verificacion",
          "mensaje"
        ]
      },
      "Aviso": {
        "type": "object",
        "additionalProperties": true,
        "properties": {
          "mensaje": {
            "type": "string"
          },
          "verificado": {
            "type": "boolean"
          },
          "restablecida": {
            "type": "boolean"
          }
        },
        "required": [
          "mensaje"
        ]
      },
      "Credenciales": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "nombre_usuario": {
            "type": "string",
            "maxLength": 254,
            "description": "Nombre de usuario (3 a 40 letras ASCII, números o _) o correo de la cuenta."
          },
          "contrasena": {
            "type": "string",
            "minLength": 8,
            "maxLength": 128,
            "format": "password"
          }
        },
        "required": [
          "nombre_usuario",
          "contrasena"
        ]
      },
      "Usuario": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
