          "nombre",
          "descripcion",
          "version",
          "creado_en",
          "actualizado_en"
        ]
      },
      "ModoCrear": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "nombre": {
            "type": "string",
            "minLength": 1,
            "maxLength": 60
          },
          "categoria": {
            "type": "string",
            "enum": [
              "manual",
              "oficina",
              "accesibilidad",
              "personalizado"
