  "components": {
    "securitySchemes": {
      "sesion": {
        "type": "apiKey",
        "in": "cookie",
        "name": "zt_session"
      },
      "csrf": {
        "type": "apiKey",
        "in": "header",
        "name": "X-CSRF-Token"
      }
    },
    "schemas": {
      "Error": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "error": {
            "type": "string"
          },
          "mensaje": {
            "type": "string"
          }
        },
        "required": [
          "error",
          "mensaje"
        ]
      },
      "Registro": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "nombre_usuario": {
            "type": "string",
            "pattern": "^[A-Za-z0-9_]{3,40}$"
          },
          "correo": {
            "type": "string",
            "format": "email",
            "maxLength": 254,
            "description": "ASCII; se normaliza a minúsculas."
          },
          "contrasena": {
            "type": "string",
            "minLength": 15,
            "maxLength": 128
          }
        },
        "required": [
          "nombre_usuario",
          "correo",
          "contrasena"
        ]
      },
      "VincularCorreo": {
        "$ref": "#/components/schemas/Registro"
      },
      "CorreoSolicitud": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "correo": {
            "type": "string",
            "format": "email",
            "maxLength": 254
          }
        },
        "required": [
          "correo"
        ]
      },
      "Token": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "token": {
            "type": "string",
            "pattern": "^[A-Za-z0-9_-]{43}$"
          }
        },
        "required": [
          "token"
        ]
