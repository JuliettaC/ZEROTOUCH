{
  "openapi": "3.1.0",
  "info": {
    "title": "ZeroTouch Hito 2",
    "version": "1.5.0",
    "description": "Monolito modular. Sesión en cookie y CSRF en mutaciones autenticadas. Propietario siempre obtenido de sesión; admin no accede a configuraciones ajenas. SQLite nueva; catálogos no prueban capacidades del motor. DELETE perfil elimina sus modos/asignaciones. PATCH exige version. Nombres NFC; unicidad NOCASE solo ASCII. JSON UTF-8, máximo 16 KB. Alias heredado /api/health fuera de esta versión. El error 500 nunca incluye detalles internos. Contraseñas de 8 a 128 caracteres; registro, restablecimiento y primer administrador rechazan contraseñas comunes o iguales al usuario o correo. v1.1: verificación de correo obligatoria antes de iniciar sesión (el login acepta usuario o correo y, solo con la contraseña correcta, responde 403 CUENTA_NO_VERIFICADA), recuperación de contraseña y respuestas que no revelan si un correo existe. Los enlaces abren /cuenta/verificar y /cuenta/restablecer fuera de /api/v1. v1.2: asignaciones gesto -> accion editables por modo (PUT /modos/{id}/gestos reemplaza todas; PATCH /modos/{id}/gestos/{gesto} edita una) con control de version optimista del modo (una sola version cubre modo y asignaciones) y contrato de capacidades (GET /capacidades, contracts/capacidades.json): una asignacion habilitada solo se guarda si el motor local ejecuta esa accion para ese gesto (400 ACCION_NO_COMPATIBLE); sin_accion siempre vale. v1.3: borrado condicional. DELETE /perfiles/{id} y DELETE /modos/{id} exigen If-Match con el ETag que el cliente conocia (428 si falta, 400 si no es un unico ETag fuerte, 412 si el recurso cambio, 404 si no existe o es ajeno). El ETag de un modo cubre su version (que incluye sus asignaciones); el del perfil es un agregado: version del perfil + (id, version) de todos sus modos, asi que detecta tambien altas, bajas y ediciones de modos y asignaciones antes del borrado en cascada. El servidor recalcula el ETag, compara y borra en una misma transaccion con bloqueo de escritura. GET /perfiles/{id} y GET /modos/{id} entregan el ETag vigente en la cabecera ETag. GET /capacidades anuncia servidor.borrado_condicional. Algoritmo y vectores: backend/src/domain/etag.js, src/sync/etag.js y contracts/etag-vectores.json. Sin cambios de esquema SQLite. v1.4: creaciones idempotentes. POST /perfiles y POST /perfiles/{id}/modos aceptan la cabecera opcional Idempotency-Key (UUID v7 en minusculas; sus 48 primeros bits son la hora, asi que la clave indica su antiguedad). Repetir la misma clave con el mismo cuerpo (tras normalizar) devuelve la respuesta ORIGINAL con la cabecera Idempotent-Replayed: true y no crea otro recurso; la misma clave con otro cuerpo o contra otro perfil padre responde 409 IDEMPOTENCIA_CONFLICTO. La comprobacion de la clave, la creacion y el registro de su resultado ocurren en una misma transaccion, de modo que dos solicitudes simultaneas crean un solo recurso. Solo se registran las creaciones que terminaron bien (un 400 o un 409 NOMBRE_DUPLICADO no deja rastro y la clave puede reutilizarse). Una clave se acepta durante 30 dias contados desde la hora que lleva incrustada (mas antigua: 422 IDEMPOTENCIA_CLAVE_EXPIRADA; hora en el futuro, mas de 5 minutos: 400 IDEMPOTENCIA_CLAVE_INVALIDA); el ambito es la cuenta autenticada. Sin la cabecera todo funciona como antes. Con una base en esquema v2 (sin la tabla) el servidor sigue operando pero responde 501 IDEMPOTENCIA_NO_DISPONIBLE a cualquier Idempotency-Key en lugar de ignorarla, y GET /capacidades anuncia servidor.idempotencia = false. Esquema SQLite v3: migracion aditiva db/migraciones/002_v2_a_v3.sql (tabla idempotencia), explicita, con respaldo previo. v1.5: mutacion conjunta modo + asignaciones. POST /perfiles/{id}/modos y PATCH /modos/{id} aceptan el campo opcional gestos (la lista completa de asignaciones, con la semantica de PUT /modos/{id}/gestos: los gestos sin fila vuelven a la accion predeterminada del catalogo; [] las borra todas). El modo y sus asignaciones se escriben en UNA transaccion y con UNA sola subida de version (un modo se crea en la version 1; un PATCH sube de v a v+1): si cualquier cosa falla, incluida una asignacion invalida o no compatible con el motor (400 DATOS_INVALIDOS / ACCION_NO_COMPATIBLE) o una version obsoleta (409), no se aplica nada, ni los campos del modo ni las asignaciones. Un PATCH puede traer solo gestos y version. La respuesta sigue siendo el modo; las asignaciones efectivas se leen con GET /modos/{id}/gestos. Con Idempotency-Key, la lista de gestos forma parte de la huella de la solicitud (el orden de la lista no importa). GET /capacidades anuncia servidor.modo_con_asignaciones; un cliente que no lo vea debe seguir usando PATCH/POST del modo y PUT de asignaciones por separado. Sin cambios de esquema SQLite. v1.6: cuotas por cuenta. Como maximo 100 perfiles por cuenta y 50 modos por perfil (409 LIMITE_RECURSOS al superarlas) y 2000 creaciones con Idempotency-Key registradas por cuenta dentro de la retencion (429 LIMITE_SOLICITUDES; las repeticiones de claves ya registradas siguen respondiendo). Sin cambios de esquema SQLite."
  },
