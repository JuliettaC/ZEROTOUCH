            "type": "string",
            "minLength": 1,
            "maxLength": 60
          },
          "descripcion": {
            "type": "string",
            "maxLength": 300
          },
          "version": {
            "type": "integer",
            "minimum": 1,
            "maximum": 9007199254740990
          },
          "creado_en": {
            "type": "string",
