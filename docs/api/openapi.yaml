            "type": "string",
            "format": "uuid"
          },
          "nombre_usuario": {
            "type": "string"
          },
          "rol": {
            "type": "string",
            "enum": [
              "user",
              "admin"
            ]
          },
          "estado": {
            "type": "string",
            "enum": [
              "activo",
              "suspendido"
            ]
          },
