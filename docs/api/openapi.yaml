{
  "openapi": "3.1.0",
  "info": {
    "title": "ZeroTouch Hito 2",
    "version": "1.1.0",
    "description": "Monolito modular. Sesión en cookie y CSRF en mutaciones autenticadas. Propietario siempre obtenido de sesión; admin no accede a configuraciones ajenas. SQLite nueva; catálogos no prueban capacidades del motor. DELETE perfil elimina sus modos/asignaciones. PATCH exige version. Nombres NFC; unicidad NOCASE solo ASCII. JSON UTF-8, máximo 16 KB. Alias heredado /api/health fuera de esta versión. El error 500 nunca incluye detalles internos. v1.1: verificación de correo obligatoria antes de iniciar sesión (cuentas no verificadas reciben el mismo 401 genérico que unas credenciales incorrectas), recuperación de contraseña y respuestas que no revelan si un correo existe. Los enlaces abren /cuenta/verificar y /cuenta/restablecer fuera de /api/v1."
  },
  "servers": [
    {
      "url": "http://127.0.0.1:3000/api/v1",
      "description": "Demo local"
    }
  ],
  "paths": {
    "/health": {
      "get": {
        "summary": "Consultar salud",
        "operationId": "Consultar_salud",
        "security": [],
        "responses": {
          "200": {
            "description": "Operación correcta",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "additionalProperties": false,
                  "properties": {
                    "data": {
                      "$ref": "#/components/schemas/Salud"
                    }
                  },
                  "required": [
                    "data"
                  ]
                }
              }
            }
          },
          "500": {
            "description": "Error interno sin detalles",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          }
        }
      }
    },
