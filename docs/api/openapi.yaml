        "description": "ETag vigente del recurso para usarlo como If-Match al borrar. Modo: identidad + version. Perfil: agregado de la version del perfil y de todos sus modos.",
        "schema": {
          "type": "string"
        }
      },
      "IdempotentReplayed": {
        "description": "Presente (true) cuando la respuesta es la original de una creacion ya realizada con la misma Idempotency-Key; ausente en la primera ejecucion.",
        "schema": {
          "type": "string",
          "enum": [
            "true"
          ]
        }
      }
    }
