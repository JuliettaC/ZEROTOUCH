            "type": "integer",
            "minimum": 0,
            "maximum": 100,
            "default": 65
          },
          "estabilizacion_puntero": {
            "type": "integer",
            "minimum": 0,
            "maximum": 100,
            "default": 40
          },
          "tolerancia_micro_pinza": {
            "type": "integer",
            "minimum": 0,
            "maximum": 100,
            "default": 50
          },
          "desk_rest_habilitado": {
            "type": "boolean",
            "default": false
          },
          "asistencia_mirada_habilitada": {
            "type": "boolean",
            "default": false
          },
          "activacion_contextual_movil": {
            "type": "boolean",
            "default": false
          },
          "gestos": {
