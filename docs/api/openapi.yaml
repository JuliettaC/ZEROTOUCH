        "required": true,
        "description": "ETag fuerte del recurso tal como el cliente lo conocia (cabecera ETag de su GET, o calculado con el algoritmo compartido a partir de lo que ya tenia). Un unico valor entre comillas; no se aceptan * ni ETags debiles ni listas.",
        "schema": {
          "type": "string",
          "pattern": "^\"[A-Za-z0-9_-]{16,64}\"$"
        }
      },
      "IdempotencyKey": {
        "name": "Idempotency-Key",
        "in": "header",
        "required": false,
        "description": "Clave de idempotencia de la creacion: un UUID v7 en minusculas generado por el cliente UNA vez por creacion y reutilizado en cada reintento. Repetirla con el mismo cuerpo devuelve la respuesta original (Idempotent-Replayed: true) sin crear otro recurso. Valida 30 dias desde la hora incrustada. Solo se anuncia con GET /capacidades servidor.idempotencia; un servidor que no la tiene habilitada responde 501.",
        "schema": {
          "type": "string",
          "pattern": "^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$"
        }
      }
    },
    "headers": {
